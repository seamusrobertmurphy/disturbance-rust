[package]
name = "disturbance-web"
description = "disturbance-core compiled to WebAssembly, for the web page."
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
disturbance-core = { path = "../core" }
reqwest = { version = "0.13", default-features = false }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
