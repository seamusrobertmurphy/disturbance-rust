[package]
name = "disturbance-cli"
description = "Terminal front end to disturbance-core."
version.workspace = true
edition.workspace = true

[[bin]]
name = "disturbance"
path = "src/main.rs"

[dependencies]
disturbance-core = { path = "../core" }
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
futures = "0.3"
serde_json = "1"
