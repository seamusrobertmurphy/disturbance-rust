[package]
name = "disturbance-core"
description = "The disturbance check itself: scene search, image reading and the method."
version.workspace = true
edition.workspace = true

# Every dependency here is pure Rust, so the same code compiles for the
# terminal and for the browser.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HTTP. No TLS feature here: the CLI adds one, and a browser brings its own.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
# Rust port of proj4js, the projection library the checker uses.
proj4rs = "0.3"
futures = "0.3"
# Deflate, for the image tiles.
miniz_oxide = "0.9"
png = "0.18"
# A clock that works in the browser too.
web-time = "1"
