[package]
name = "disturbance-py"
description = "disturbance-core as a Python module, for notebooks in ArcGIS Pro and QGIS."
version.workspace = true
edition.workspace = true

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
disturbance-core = { path = "../core" }
# One build for every Python from 3.9 on, the stable ABI. The import
# library is generated, so the Windows build needs no Python install.
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39", "generate-import-lib"] }
# native-tls uses the operating system's certificate store, SChannel on
# Windows, so a company proxy that inspects traffic is trusted as Edge
# trusts it.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "system-proxy"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
serde_json = "1"
